# Compila a solução em cada envio para o GitHub e cria o instalador (NexuVig-Setup.exe).
# Nas branches publicadas (master e alojamento-online) o instalador é também publicado
# em Releases; a página de descarga aponta sempre para a versão mais recente.
name: Compilar e criar instalador

on:
  push:
    branches: [master, alojamento-online, app-descarga, contas-perfis]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: windows-latest
    env:
      VERSAO: 1.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Compilar a solução (Agent, programa, Server, Dashboard)
        run: dotnet build NexuVig.slnx -c Release

      - name: Publicar o Agent (ficheiro único)
        run: dotnet publish nex/NexuVig.Agent/NexuVig.Agent/NexuVig.Agent.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o publish/Agent

      - name: Publicar o programa NexuVig (ficheiro único)
        run: dotnet publish nex/NexuVig.Agent/NexuVig.App/NexuVig.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o publish/App

      - name: Criar o instalador (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          & $iscc "/DVersaoApp=$env:VERSAO" installer\NexuVig-Agent.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: NexuVig-Setup
          path: installer/output/NexuVig-Setup.exe

      - name: Publicar em Releases
        if: github.event_name == 'push' && (github.ref_name == 'master' || github.ref_name == 'alojamento-online')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$env:VERSAO" installer/output/NexuVig-Setup.exe `
            --target "${{ github.sha }}" `
            --title "NexuVig $env:VERSAO" `
            --notes "Instalador do NexuVig (Agent + programa). Criado automaticamente a partir de ${{ github.sha }}." `
            --latest
